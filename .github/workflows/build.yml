name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web UI
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Test
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build portable exe
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Package
        shell: bash
        run: |
          mkdir -p out/DanceDNS-windows-x64
          cp core/target/release/dancedns.exe packaging/README.txt out/DanceDNS-windows-x64/
          cd out && 7z a DanceDNS-windows-x64.zip DanceDNS-windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: DanceDNS-windows-x64
          path: out/DanceDNS-windows-x64/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/DanceDNS-windows-x64.zip
