name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: dancedns.exe
            pkg: DanceDNS-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: dancedns
            pkg: DanceDNS-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web UI
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Test
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build portable binary
        run: cargo build --release --manifest-path core/Cargo.toml --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.pkg }}"
          cp "core/target/${{ matrix.target }}/release/${{ matrix.bin }}" "out/${{ matrix.pkg }}/"
          cp packaging/README.txt "out/${{ matrix.pkg }}/"
          cd out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ matrix.pkg }}.zip" "${{ matrix.pkg }}"
          else
            tar czf "${{ matrix.pkg }}.tar.gz" "${{ matrix.pkg }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: out/${{ matrix.pkg }}/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.tar.gz
