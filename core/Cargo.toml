[package]
name = "dancedns"
version = "0.3.0"
edition = "2021"
description = "Portable process-aware DNS-over-QUIC / DNS-over-HTTPS client for Windows with per-process rules."
license = "MIT"
build = "build.rs"

[[bin]]
name = "dancedns"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
hickory-proto = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
glob = "0.3"
lru = "0.12"
bytes = "1"
url = "2"
parking_lot = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_IO",
    "Win32_System_Time",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Diagnostics_Etw",
    "Win32_UI_WindowsAndMessaging",
] }
native-windows-gui = { version = "1.0.13", default-features = false, features = ["tray-notification", "list-view", "animation-timer", "combobox", "menu", "embed-resource", "cursor", "high-dpi"] }


[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
rcgen = "0.13"
