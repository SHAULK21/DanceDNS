[package]
name = "dancedns"
version = "0.2.0"
edition = "2021"
description = "Portable process-aware DNS-over-HTTPS client with per-process routing rules and a built-in web UI."
license = "MIT"
build = "build.rs"

[[bin]]
name = "dancedns"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
hickory-proto = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
glob = "0.3"
lru = "0.12"
bytes = "1"
axum = "0.7"
rust-embed = "8"
mime_guess = "2"
url = "2"
parking_lot = "0.12"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_IO",
] }


[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
